<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>헌법 탐정단 : 사라진 시민의 권리를 찾아라!</title>
<meta name="description" content="초등 고학년 헌법교육 비주얼 노벨 추리 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2340; --paper:#fbf6ea; --gold:#e8b75a; --gold2:#c98f2c; --navy:#18203f; --navy2:#26305c;
  --red:#d9534f; --mint:#4fb59a; --sky:#5aa7e0; --muted:#7c7f93;
  --font-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-story:'Gowun Batang','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',serif;
  --font-title:'Black Han Sans','Do Hyeon','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0e1c;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);color:var(--ink);user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none}
#game{position:absolute;inset:0;overflow:hidden;background:#000;border-radius:6px;box-shadow:0 0 60px rgba(0,0,0,.6)}
.layer{position:absolute;inset:0}
#bg svg,#bgNext svg{width:100%;height:100%;display:block}
#bgNext{opacity:0;transition:opacity .7s ease}
#bgNext.show{opacity:1}
#vignette{pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)}

/* characters */
#chars{pointer-events:none}
.sprite{position:absolute;bottom:-40px;width:330px;height:660px;transition:left .5s cubic-bezier(.3,.8,.3,1),opacity .4s,filter .3s,transform .35s;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.sprite svg{width:100%;height:100%;overflow:visible}
.sprite.dim{filter:brightness(.62) saturate(.7) drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.sprite.enter{opacity:0;transform:translateY(30px)}
.sprite.talk{transform:translateY(-6px)}
.sprite.lean{transform:translateY(-4px) rotate(-2deg) scale(1.03)}
.sprite.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
.sprite .blink{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* hotspots */
#hotspots{z-index:5}
.hs{pointer-events:auto;position:absolute;border-radius:14px;cursor:zoom-in;transition:background .2s,box-shadow .2s}
.hs::before{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(255,236,170,.95);box-shadow:0 0 10px 4px rgba(255,210,100,.75)}
.hs.done::before{background:rgba(160,230,190,.9);box-shadow:0 0 6px 2px rgba(120,220,170,.6);width:10px;height:10px;margin:-5px 0 0 -5px}
.hs::after{content:'';position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid rgba(255,236,170,.95);box-shadow:0 0 12px rgba(255,220,120,.9);animation:pulse 1.8s infinite}
.hs.done::after{border-color:rgba(160,230,190,.9);box-shadow:0 0 8px rgba(120,220,170,.7);animation:none;width:16px;height:16px;margin:-8px 0 0 -8px}
.hs:hover{background:rgba(255,236,170,.16);box-shadow:inset 0 0 0 2px rgba(255,236,170,.75)}
.hs .lbl{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:rgba(20,24,48,.92);color:#ffe9b0;padding:5px 12px;border-radius:20px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid rgba(232,183,90,.6)}
.hs:hover .lbl,.hs.showlbl .lbl{opacity:1}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}80%{transform:scale(1.9);opacity:0}100%{opacity:0}}
#investBar{position:absolute;right:22px;bottom:22px;z-index:6;display:none;gap:10px;align-items:center}
#investBar .tag{background:rgba(20,24,48,.88);color:#ffe9b0;padding:10px 16px;border-radius:12px;font-size:18px;border:1px solid rgba(232,183,90,.5)}
#investHelp{pointer-events:none;position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:6;display:none;background:rgba(20,24,48,.85);color:#fff;padding:8px 20px;border-radius:30px;font-size:18px;border:1px solid rgba(232,183,90,.5)}

/* location */
#loc{position:absolute;left:20px;top:16px;z-index:7;display:none;align-items:center;gap:10px}
#loc .case{background:var(--gold);color:var(--navy);font-family:var(--font-title);padding:4px 12px;border-radius:6px;font-size:18px;letter-spacing:1px}
#loc .place{background:rgba(20,24,48,.82);color:#fff;padding:6px 16px;border-radius:6px;font-size:18px;border-left:4px solid var(--gold)}

/* top bar */
#topbar{position:absolute;right:14px;top:12px;z-index:8;display:none;gap:8px}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(20,24,48,.82);color:#ffe9b0;border:1px solid rgba(232,183,90,.55);border-radius:12px;padding:6px 10px 4px;cursor:pointer;font-family:var(--font-ui);font-size:13px;min-width:62px;transition:transform .15s,background .2s}
.tb:hover{background:rgba(40,48,92,.95);transform:translateY(-2px)}
.tb svg{width:26px;height:26px}
.tb .badge{position:absolute;margin:-4px 0 0 30px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;display:none}
.tb{position:relative}

/* dialog */
#dialog{position:absolute;left:40px;right:40px;bottom:20px;height:196px;z-index:9;display:none;cursor:pointer}
#dialog .box{position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,32,63,.93),rgba(16,21,44,.96));border:2px solid rgba(232,183,90,.75);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 6px rgba(255,255,255,.03)}
#dialog .box::before{content:'';position:absolute;left:14px;right:14px;top:10px;bottom:10px;border:1px solid rgba(232,183,90,.22);border-radius:12px;pointer-events:none}
#nameplate{position:absolute;left:34px;top:-24px;padding:7px 26px;border-radius:12px 12px 12px 0;font-size:22px;font-weight:700;color:#fff;background:var(--gold2);box-shadow:0 4px 10px rgba(0,0,0,.35);letter-spacing:1px;font-family:var(--font-ui)}
#nameplate .role{font-size:14px;opacity:.85;margin-left:8px;font-weight:400}
#dtext{overflow-y:auto!important;position:absolute;left:44px;right:44px;top:36px;bottom:20px;color:#f6f1e3;font-family:var(--font-story);font-size:25px;line-height:1.62;word-break:keep-all;overflow:hidden}
#dtext.narr{color:#e7e1cf;font-style:normal}
#dtext em{color:#ffd77a;font-style:normal;font-weight:700}
#dtext b{color:#9fe0c8}
#next{position:absolute;right:30px;bottom:16px;color:var(--gold);font-size:22px;animation:nextb 1s infinite;display:none}
@keyframes nextb{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
#dlgtools{position:absolute;right:26px;top:-34px;display:flex;gap:6px}
#dlgtools button{background:rgba(20,24,48,.85);color:#e9dfc3;border:1px solid rgba(232,183,90,.45);border-radius:8px;font-size:13px;padding:4px 10px;cursor:pointer;font-family:var(--font-ui)}

/* overlays */
#ovl{position:absolute;inset:0;z-index:20;pointer-events:none}
.panel-wrap{position:absolute;inset:0;background:rgba(8,10,24,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.panel{position:relative;background:var(--paper);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:28px 34px;max-height:660px;overflow:auto;color:var(--ink);animation:popin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{margin:0 0 6px;font-family:var(--font-title);font-weight:400;font-size:32px;color:var(--navy);letter-spacing:1px}
.panel h3{margin:14px 0 6px;font-size:21px;color:var(--navy2)}
.panel .sub{color:var(--muted);font-size:17px;margin-bottom:14px}
.panel p{font-size:19px;line-height:1.65;margin:8px 0;word-break:keep-all}
.panel.paper{background:linear-gradient(#fbf6ea,#f4ecd8);border:1px solid #d9c9a3}
.x{position:absolute;right:14px;top:12px;width:40px;height:40px;border-radius:50%;border:none;background:#e9dfc6;color:var(--navy);font-size:22px;cursor:pointer;z-index:2}
.x:hover{background:#ddcfaf}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-size:20px;padding:12px 26px;border-radius:14px;border:none;cursor:pointer;background:var(--navy);color:#ffe9b0;box-shadow:0 4px 0 #0b1027;transition:transform .1s,box-shadow .1s,background .2s;font-weight:700}
.btn:hover{background:var(--navy2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1027}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold2)}
.btn.gold:hover{background:#f0c56f}
.btn.ghost{background:#e9dfc6;color:var(--navy);box-shadow:0 4px 0 #cbbd9b}
.btn.small{font-size:16px;padding:8px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center}

/* choice */
.choices{display:flex;flex-direction:column;gap:14px;width:820px;pointer-events:auto}
.choice-q{background:rgba(20,24,48,.92);color:#ffe9b0;border:2px solid rgba(232,183,90,.7);border-radius:16px;padding:16px 24px;font-size:23px;font-family:var(--font-story);text-align:center;margin-bottom:6px;word-break:keep-all}
.choice{background:linear-gradient(90deg,rgba(251,246,234,.97),rgba(244,236,216,.97));border:2px solid #d9c9a3;border-radius:14px;padding:15px 24px;font-size:21px;cursor:pointer;text-align:left;font-family:var(--font-ui);color:var(--ink);transition:transform .15s,border-color .2s;word-break:keep-all;line-height:1.45}
.choice:hover{transform:translateX(8px);border-color:var(--gold2)}
.choice .k{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:var(--navy);color:var(--gold);margin-right:12px;font-weight:700;font-size:17px}
.choice.used{opacity:.55}

/* popup (clue) */
.getcard{width:620px;text-align:center;padding:30px 36px}
.getcard .ribbon{display:inline-block;background:var(--navy);color:var(--gold);padding:6px 22px;border-radius:30px;font-size:18px;margin-bottom:12px;letter-spacing:2px}
.getcard .ic{width:120px;height:120px;margin:0 auto 10px}
.getcard .nm{font-size:28px;font-weight:700;color:var(--navy);margin-bottom:8px}
.getcard .ds{font-size:19px;line-height:1.65;text-align:left;background:#fff;border:1px dashed #cdbb92;border-radius:12px;padding:14px 18px;white-space:pre-line;word-break:keep-all}
.law-box{background:#fff;border-left:6px solid var(--gold2);border-radius:10px;padding:14px 18px;font-family:var(--font-story);font-size:19px;line-height:1.7;text-align:left;word-break:keep-all}
.easy{background:#eaf6f1;border-radius:10px;padding:12px 16px;font-size:18px;line-height:1.6;margin-top:10px;text-align:left;word-break:keep-all}
.easy b{color:#1f7a62}

/* doc viewer */
.docview{width:820px}
.docview .docbody{background:#fff;border:1px solid #e1d5b8;border-radius:12px;padding:18px 24px;font-family:var(--font-story);font-size:19px;line-height:1.75;white-space:pre-line;word-break:keep-all;box-shadow:inset 0 0 30px rgba(200,180,130,.15)}

/* notebook */
.nb{width:1080px;height:640px;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;background:#ebe1c9;cursor:pointer;font-size:17px;border:none;font-family:var(--font-ui);color:var(--ink)}
.tab.on{background:var(--navy);color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;overflow:auto;padding:4px;flex:1;align-content:start}
.card{background:#fff;border:2px solid #e2d6b9;border-radius:14px;padding:12px;cursor:pointer;transition:transform .15s,border-color .15s;min-height:120px;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--gold2)}
.card.sel{border-color:var(--sky);box-shadow:0 0 0 3px rgba(90,167,224,.35)}
.card .ct{font-size:13px;color:#fff;background:var(--muted);align-self:flex-start;padding:2px 8px;border-radius:6px}
.card .ct.law{background:var(--gold2)}.card .ct.testi{background:#8a5cc2}.card .ct.doc{background:#3c7fb8}.card .ct.ev{background:#4f9b6e}
.card .cn{font-weight:700;font-size:18px;color:var(--navy);line-height:1.3}
.card .cd{font-size:14px;color:#555;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card.locked{background:#eee7d6;cursor:default;opacity:.7}
.card.locked .cn{color:#9a917c}
.detail{display:flex;gap:18px;flex:1;min-height:0}
.empty{color:var(--muted);font-size:18px;padding:30px;text-align:center}

/* puzzle */
.pz{width:1120px;height:660px;display:flex;flex-direction:column;padding:22px 30px}
.pz .phead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pz .ptype{background:var(--navy);color:var(--gold);padding:5px 14px;border-radius:8px;font-size:15px;letter-spacing:1px}
.pz .ptitle{font-family:var(--font-title);font-size:28px;color:var(--navy)}
.pz .pintro{font-size:18px;line-height:1.6;color:#3d4160;margin-bottom:10px;word-break:keep-all}
.pz .pbody{flex:1;min-height:0;overflow:auto;padding:4px}
.pz .pfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px dashed #d4c49d}
.fb{font-size:18px;color:#a03a2a;min-height:28px;flex:1;word-break:keep-all;line-height:1.45}
.fb.ok{color:#1f7a62}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slot{background:#fff;border:2px dashed #cdbb92;border-radius:14px;padding:12px 16px;cursor:pointer;min-height:118px;transition:border-color .2s,background .2s}
.slot:hover{border-color:var(--gold2);background:#fffdf6}
.slot .sq{font-size:17px;color:var(--navy2);font-weight:700;margin-bottom:8px;word-break:keep-all}
.slot .sv{font-size:17px;color:#444;word-break:keep-all}
.slot .sv.none{color:#aaa}
.slot.filled{border-style:solid;border-color:#9ab7d6}
.slot.bad{border-color:var(--red);animation:shake .4s}
.slot.good{border-color:var(--mint);background:#effaf5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stm{background:#fff;border:2px solid #e2d6b9;border-radius:14px;padding:12px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s}
.stm:hover{border-color:var(--gold2)}
.stm.sel{border-color:var(--sky);background:#f2f8fd}
.stm .who{flex:none;width:96px;font-weight:700;color:var(--navy);font-size:17px}
.stm .say{font-size:18px;line-height:1.55;word-break:keep-all}
.opt{background:#fff;border:2px solid #e2d6b9;border-radius:12px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-size:18px;line-height:1.5;word-break:keep-all;display:flex;gap:12px;align-items:flex-start}
.opt:hover{border-color:var(--gold2)}
.opt.sel{border-color:var(--sky);background:#eef6fd}
.opt .chk{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid #b9a77f;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.opt.sel .chk{background:var(--sky);border-color:var(--sky)}
.match{display:flex;gap:22px;height:100%}
.match .col{flex:1;display:flex;flex-direction:column;gap:9px}
.mitem{background:#fff;border:2px solid #e2d6b9;border-radius:12px;padding:10px 14px;cursor:pointer;font-size:17px;line-height:1.45;word-break:keep-all;position:relative}
.mitem:hover{border-color:var(--gold2)}
.mitem.sel{border-color:var(--sky);box-shadow:0 0 0 3px rgba(90,167,224,.3)}
.mitem .tagto{display:block;margin-top:6px;font-size:14px;color:#fff;background:var(--navy2);border-radius:6px;padding:2px 8px;width:max-content;max-width:100%}
.mtarget{background:#f6efdd;border:2px dashed #c9b585;border-radius:14px;padding:12px 14px;cursor:pointer;min-height:70px;transition:background .2s}
.mtarget:hover{background:#fff7e1}
.mtarget.armed{border-color:var(--sky);background:#eef6fd}
.mtarget .tt{font-weight:700;color:var(--navy);font-size:18px;margin-bottom:4px}
.mtarget .td{font-size:14px;color:#666;line-height:1.4}
.mtarget .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--navy2);color:#ffe9b0;border-radius:8px;padding:3px 9px;font-size:13px}
.codebox{display:flex;gap:10px;justify-content:center;margin:20px 0}
.codebox input{width:420px;font-size:30px;text-align:center;padding:12px;border-radius:12px;border:2px solid #cdbb92;font-family:var(--font-ui);letter-spacing:6px}
.cipher{background:#20284d;color:#ffe9b0;border-radius:14px;padding:18px 24px;font-size:19px;line-height:1.9;font-family:var(--font-story);word-break:keep-all}
.cipher b{color:#7fe0c0}
.order-list{display:flex;flex-direction:column;gap:9px}
.ord{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid #e2d6b9;border-radius:12px;padding:10px 14px;font-size:18px;word-break:keep-all}
.ord .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700}
.ord .mv{margin-left:auto;display:flex;gap:6px}
.ord .mv button{width:36px;height:36px;border-radius:8px;border:none;background:#ebe1c9;cursor:pointer;font-size:18px}
.build .bslot{margin-bottom:14px}
.build .blabel{font-weight:700;color:var(--navy2);margin-bottom:6px;font-size:17px}
.build .bopts{display:flex;flex-wrap:wrap;gap:8px}
.bopt{background:#fff;border:2px solid #e2d6b9;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:17px;word-break:keep-all}
.bopt.sel{border-color:var(--sky);background:#eef6fd}
.preview{background:#fff;border-left:6px solid var(--mint);border-radius:10px;padding:14px 18px;font-family:var(--font-story);font-size:20px;line-height:1.7;margin-top:10px;word-break:keep-all}
textarea.wr{width:100%;min-height:120px;font-size:19px;font-family:var(--font-ui);padding:12px 14px;border-radius:12px;border:2px solid #cdbb92;line-height:1.6;resize:none;background:#fff;user-select:text;-webkit-user-select:text}
input.nm{font-size:26px;padding:12px 16px;border-radius:12px;border:2px solid #cdbb92;width:360px;text-align:center;font-family:var(--font-ui);user-select:text;-webkit-user-select:text}

/* picker (inside puzzle) */
.picker{position:absolute;inset:0;background:rgba(251,246,234,.98);border-radius:18px;padding:22px 28px;display:flex;flex-direction:column;z-index:3}

/* hint */
.hint{width:640px}
.hint .lv{display:flex;gap:10px;margin:10px 0}
.hint .lvb{flex:1;padding:10px;border-radius:12px;background:#ebe1c9;text-align:center;font-size:16px}
.hint .lvb.on{background:var(--navy);color:var(--gold)}
.hint .htext{background:#fff;border-radius:12px;border:1px dashed #cdbb92;padding:16px 18px;font-size:19px;line-height:1.65;word-break:keep-all;min-height:80px}

/* screens */
.screen{position:absolute;inset:0;z-index:15;display:none}
.screen.on{display:block}
#title .logo{position:absolute;left:0;right:0;top:70px;text-align:center}
#title .logo .t1{white-space:nowrap;font-family:var(--font-title);font-size:64px;color:#fff6dc;text-shadow:0 6px 0 #8c4f1c,0 10px 30px rgba(0,0,0,.6);letter-spacing:6px}
#title .logo .t2{font-family:var(--font-title);font-size:38px;color:var(--gold);text-shadow:0 3px 0 #3a2410,0 6px 16px rgba(0,0,0,.6);margin-top:-6px;letter-spacing:3px}
#title .logo .t3{font-family:var(--font-story);font-size:22px;color:#fff;margin-top:12px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#title .menu{position:absolute;left:50%;top:330px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;width:340px}
.mbtn{background:linear-gradient(180deg,rgba(28,36,72,.92),rgba(16,21,44,.95));color:#ffe9b0;border:2px solid rgba(232,183,90,.7);border-radius:14px;padding:11px 0;font-size:22px;cursor:pointer;font-family:var(--font-ui);font-weight:700;letter-spacing:2px;transition:transform .15s,background .2s;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.mbtn:hover{transform:scale(1.04);background:linear-gradient(180deg,rgba(48,58,108,.95),rgba(26,32,64,.98))}
.mbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
#title .foot{position:absolute;bottom:14px;width:100%;text-align:center;color:rgba(255,255,255,.75);font-size:14px}
#title .teacher{position:absolute;right:18px;bottom:14px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px;font-family:var(--font-ui)}

/* map */
#map .mpin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;text-align:center;transition:transform .2s}
#map .mpin:hover{transform:translate(-50%,-100%) scale(1.07)}
#map .mpin .pinbox{background:rgba(251,246,234,.97);border:3px solid var(--navy);border-radius:14px;padding:8px 14px;box-shadow:0 8px 18px rgba(0,0,0,.35);min-width:190px}
#map .mpin .cno{font-family:var(--font-title);color:var(--gold2);font-size:16px;letter-spacing:1px}
#map .mpin .cnm{font-weight:700;color:var(--navy);font-size:19px;white-space:nowrap}
#map .mpin .cst{font-size:13px;color:#fff;background:var(--mint);border-radius:6px;padding:1px 8px;display:inline-block;margin-top:3px}
#map .mpin .cst.lock{background:#999}#map .mpin .cst.new{background:var(--red)}
#map .mpin::after{content:'';display:block;margin:0 auto;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:16px solid var(--navy)}
#map .mpin.locked{filter:grayscale(1) brightness(.8);cursor:not-allowed}
#map .mhead{position:absolute;left:24px;top:18px;background:rgba(20,24,48,.88);color:#fff;border-radius:14px;padding:12px 20px;border:2px solid rgba(232,183,90,.6)}
#map .mhead .a{font-family:var(--font-title);font-size:26px;color:var(--gold)}
#map .mhead .b{font-size:16px;margin-top:2px}
#map .mbtns{position:absolute;right:20px;top:18px;display:flex;gap:8px}
#map .pages{position:absolute;left:24px;bottom:20px;display:flex;gap:8px;align-items:center;background:rgba(20,24,48,.88);border-radius:14px;padding:10px 16px;border:2px solid rgba(232,183,90,.6);color:#fff;font-size:16px}
.pg{width:46px;height:58px;border-radius:4px;background:#3b4166;border:2px dashed #6a7099;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9aa0c7}
.pg.on{background:linear-gradient(#fff6dc,#ead8a6);border:2px solid var(--gold);color:var(--navy);font-weight:700}

/* full panels (record, archive, teacher, ending) */
.full{position:absolute;inset:0;background:linear-gradient(135deg,#f7efdc,#efe2c2);padding:26px 36px;overflow:auto;color:var(--ink)}
.full h1{font-family:var(--font-title);font-weight:400;font-size:38px;margin:0;color:var(--navy)}
.full .back{position:absolute;right:24px;top:22px}
.stat{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:19px}
.stat .nm{width:160px}
.stat .bar{flex:1;height:18px;background:#e5d8b8;border-radius:10px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#7fd0b8);border-radius:10px}
.stat .v{width:70px;text-align:right;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:#fffaf0;border:1px solid #dccba2;border-radius:16px;padding:16px 20px}
.box h3{margin:0 0 8px;font-size:21px;color:var(--navy2)}
.kv{font-size:17px;line-height:1.8}
.decl{background:#fff;border:3px double var(--gold2);border-radius:14px;padding:22px 30px;font-family:var(--font-story);font-size:21px;line-height:1.9;word-break:keep-all}
.typebadge{display:inline-block;background:var(--navy);color:var(--gold);font-family:var(--font-title);font-size:30px;padding:10px 26px;border-radius:14px;letter-spacing:2px}
table.tt{border-collapse:collapse;width:100%;font-size:16px}
table.tt td,table.tt th{border:1px solid #d9c9a3;padding:7px 10px;text-align:left;vertical-align:top;word-break:keep-all}
table.tt th{background:#ece0c2}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#fade.on{opacity:1}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%) translateY(-20px);background:rgba(20,24,48,.95);color:#ffe9b0;border:1px solid var(--gold);border-radius:30px;padding:10px 24px;font-size:18px;z-index:45;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#casecard{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(24,32,63,.88),rgba(8,10,24,.97));color:#fff}
#casecard.on{display:flex;animation:fadein .6s}
#casecard .cno{font-family:var(--font-title);font-size:34px;color:var(--gold);letter-spacing:8px}
#casecard .cnm{font-family:var(--font-title);font-size:70px;margin:10px 0;text-shadow:0 6px 20px rgba(0,0,0,.6)}
#casecard .csub{font-family:var(--font-story);font-size:22px;color:#d8d2c0}
#casecard .line{width:420px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0}
.flash{animation:flash .5s}
@keyframes flash{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
.shake{animation:shake .4s}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#cdbb92;border-radius:10px}::-webkit-scrollbar-track{background:transparent}

#rotate{display:none;position:fixed;left:0;right:0;top:0;background:#e8b75a;color:#18203f;text-align:center;font-family:var(--font-ui);font-size:15px;padding:6px;z-index:99}
@media (orientation:portrait) and (max-width:900px){#rotate{display:block}}

.navgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.navcard{background:#fff;border:2px solid #e2d6b9;border-radius:16px;padding:14px;cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.navcard:hover{transform:translateY(-3px);border-color:var(--gold2)}
.navcard .ni{font-size:34px;line-height:1}
.navcard .nn{font-weight:700;font-size:19px;color:var(--navy)}
.navcard .nd{font-size:14px;color:#666;line-height:1.4;flex:1;word-break:keep-all}
.navcard .ns{font-size:14px;font-weight:700;color:var(--navy2)}
.navcard.locked{background:#ece5d3}.navcard.locked .ns{color:#a0522d}
.navcard.done{border-color:var(--mint);background:#f1fbf6}.navcard.done .ns{color:#1f7a62}

</style>
</head>
<body>
<div id="rotate">📱 화면을 가로로 돌리면 게임을 더 크게 볼 수 있어요</div>
<div id="wrap"><div id="game">
  <div id="bg" class="layer"></div><div id="bgNext" class="layer"></div>
  <div id="chars" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="hotspots" class="layer" style="pointer-events:none"></div>
  <div id="loc"><span class="case"></span><span class="place"></span></div>
  <div id="topbar"></div>
  <div id="investHelp"></div><div id="investBar"></div>
  <div id="dialog"><div class="box"></div><div id="nameplate"></div><div id="dlgtools"><button id="dlgSkip">⏩ 빠르게</button><button id="dlgLog">📜 기록</button></div><div id="dtext"></div><div id="next">▼</div></div>
  <div id="title" class="screen"></div>
  <div id="map" class="screen"></div>
  <div id="full" class="screen full"></div>
  <div id="casecard"></div>
  <div id="ovl"></div>
  <div id="toast"></div>
  <div id="fade"></div>
</div></div>
<script>
/* ============ 캐릭터 일러스트 (SVG 생성) ============ */
const ART = {};
(function(){
  let uid = 0;
  const shade = (hex, amt) => { // amt -1..1
    let c = hex.replace('#','');
    if(c.length===3) c = c.split('').map(x=>x+x).join('');
    let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    const f = v => Math.max(0,Math.min(255,Math.round(amt<0? v*(1+amt) : v+(255-v)*amt)));
    return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
  };
  ART.shade = shade;

  /* ---------- hair ---------- */
  function hairBack(st, c, id){
    const d = shade(c,-.25);
    switch(st){
      case 'bob': return `<path d="M108 185 Q96 82 200 74 Q304 82 292 185 L296 292 Q262 306 246 276 L154 276 Q138 306 104 292 Z" fill="${c}"/><path d="M118 230 Q114 270 120 290" stroke="${d}" stroke-width="3" fill="none"/><path d="M282 230 Q286 270 280 290" stroke="${d}" stroke-width="3" fill="none"/>`;
      case 'twin': return `<path d="M116 195 Q110 84 200 76 Q290 84 284 195 Z" fill="${c}"/>
        <path d="M122 150 Q58 190 66 300 Q72 360 98 392 Q92 330 104 280 Q112 230 134 196 Z" fill="${c}"/><path d="M82 250 Q80 320 96 380" stroke="${d}" stroke-width="3" fill="none"/>
        <path d="M278 150 Q342 190 334 300 Q328 360 302 392 Q308 330 296 280 Q288 230 266 196 Z" fill="${c}"/><path d="M318 250 Q320 320 304 380" stroke="${d}" stroke-width="3" fill="none"/>`;
      case 'long': return `<path d="M110 185 Q100 80 200 72 Q300 80 290 185 L306 470 Q262 492 236 450 L164 450 Q138 492 94 470 Z" fill="${c}"/><path d="M120 260 Q112 360 118 450" stroke="${d}" stroke-width="3" fill="none"/><path d="M280 260 Q288 360 282 450" stroke="${d}" stroke-width="3" fill="none"/><path d="M140 300 Q134 380 140 440" stroke="${d}" stroke-width="2" fill="none" opacity=".6"/>`;
      case 'pony': return `<path d="M116 190 Q110 82 200 76 Q290 82 284 190 Z" fill="${c}"/><path d="M262 110 Q350 120 338 250 Q330 330 300 380 Q312 300 296 230 Q286 170 250 130 Z" fill="${c}"/><path d="M318 190 Q326 260 306 350" stroke="${d}" stroke-width="3" fill="none"/>`;
      case 'bun': return `<circle cx="200" cy="72" r="38" fill="${c}"/><path d="M174 64 Q200 50 226 64" stroke="${d}" stroke-width="3" fill="none"/><path d="M114 192 Q108 86 200 80 Q292 86 286 192 Z" fill="${c}"/>`;
      case 'curly': return `<path d="M112 200 Q92 120 130 92 Q150 64 200 66 Q250 64 270 92 Q308 120 288 200 Q300 250 280 280 L120 280 Q100 250 112 200Z" fill="${c}"/>`;
      default: return `<path d="M120 185 Q114 84 200 78 Q286 84 280 185 Z" fill="${c}"/>`;
    }
  }
  function hairFront(st, c){
    const d = shade(c,-.3), l = shade(c,.25);
    const shine = `<path d="M150 112 Q175 100 205 104" stroke="${l}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>`;
    switch(st){
      case 'bob': return `<path d="M120 182 Q114 88 200 82 Q286 88 280 182 Q268 140 246 128 Q234 152 208 156 Q214 134 202 120 Q182 150 150 152 Q160 136 160 126 Q138 146 120 182 Z" fill="${c}"/><path d="M202 120 Q196 140 186 148" stroke="${d}" stroke-width="2.5" fill="none"/><path d="M246 128 Q252 150 262 160" stroke="${d}" stroke-width="2.5" fill="none"/>${shine}`;
      case 'twin': return `<path d="M124 178 Q118 90 200 84 Q282 90 276 178 Q262 150 250 140 Q246 160 230 166 Q232 146 222 134 Q206 160 178 162 Q190 144 186 132 Q160 154 140 158 Q146 146 146 140 Q132 156 124 178 Z" fill="${c}"/>${shine}`;
      case 'long': return `<path d="M120 190 Q112 86 200 80 Q288 86 280 190 Q272 150 252 126 Q232 120 206 108 L200 118 L194 108 Q168 120 148 126 Q128 150 120 190 Z" fill="${c}"/><path d="M200 112 Q176 140 160 176" stroke="${d}" stroke-width="2" fill="none"/><path d="M200 112 Q224 140 240 176" stroke="${d}" stroke-width="2" fill="none"/>${shine}`;
      case 'pony': return `<path d="M122 180 Q116 88 200 82 Q284 88 278 176 Q266 138 232 126 Q214 150 184 150 Q194 136 192 128 Q156 140 140 160 Q132 168 122 180 Z" fill="${c}"/>${shine}`;
      case 'short': return `<path d="M122 172 Q116 84 200 80 Q284 86 280 170 Q272 128 250 116 Q222 140 176 132 Q186 124 188 116 Q150 128 134 146 Q126 158 122 172 Z" fill="${c}"/><path d="M188 116 Q200 98 230 96" stroke="${d}" stroke-width="2.5" fill="none"/>${shine}`;
      case 'spiky': return `<path d="M118 176 Q110 96 150 80 L156 64 L178 78 L196 56 L214 76 L240 60 L246 84 Q290 96 282 176 L268 146 L258 162 L246 130 L232 152 L218 124 L204 150 L188 122 L176 150 L160 126 L150 154 L136 136 Z" fill="${c}"/>${shine}`;
      case 'bun': return `<path d="M122 176 Q118 92 200 86 Q282 92 278 176 Q268 130 236 118 Q210 112 200 124 Q190 112 164 118 Q132 130 122 176 Z" fill="${c}"/>${shine}`;
      case 'curly': return `<path d="M120 176 Q112 120 140 100 Q162 84 200 86 Q238 84 260 100 Q288 120 280 176 Q270 150 258 136 Q252 150 238 146 Q236 130 224 124 Q214 140 200 136 Q190 124 176 126 Q168 142 156 140 Q150 128 142 134 Q128 150 120 176Z" fill="${c}"/><circle cx="140" cy="112" r="12" fill="${l}" opacity=".35"/>`;
      case 'gray': return `<path d="M120 176 Q116 92 200 86 Q284 92 280 176 Q272 134 246 120 Q206 136 160 124 Q134 140 120 176 Z" fill="${c}"/><path d="M160 124 Q200 110 246 120" stroke="${d}" stroke-width="2" fill="none"/>`;
      default: return `<path d="M122 172 Q116 86 200 82 Q284 86 278 172 Q262 132 200 130 Q138 132 122 172 Z" fill="${c}"/>${shine}`;
    }
  }

  /* ---------- face parts ---------- */
  function eyes(e, eyeC, id, skin){
    const lid = shade(skin,-.35);
    const iris = (cx,cy,rx,ry,dx=0,dy=0)=>`
      <ellipse cx="${cx}" cy="${cy}" rx="${rx+5}" ry="${ry+4}" fill="#fff"/>
      <ellipse cx="${cx+dx}" cy="${cy+dy+1}" rx="${rx}" ry="${ry}" fill="url(#iris${id})"/>
      <ellipse cx="${cx+dx}" cy="${cy+dy+3}" rx="${rx*.45}" ry="${ry*.5}" fill="#141420"/>
      <circle cx="${cx+dx-rx*.4}" cy="${cy+dy-ry*.35}" r="${Math.max(3,rx*.38)}" fill="#fff"/>
      <circle cx="${cx+dx+rx*.4}" cy="${cy+dy+ry*.45}" r="2.2" fill="#fff" opacity=".85"/>`;
    const lash = (cx,cy,w,lift=0)=>`<path d="M${cx-w} ${cy-12+lift} Q${cx} ${cy-28+lift} ${cx+w+2} ${cy-14+lift}" stroke="#1d1a2a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${cx+w} ${cy-14+lift} l6 -4" stroke="#1d1a2a" stroke-width="3" stroke-linecap="round"/>`;
    const L=166, R=234, Y=202;
    switch(e){
      case 'happy': case 'cheer':
        return `<path d="M${L-16} ${Y+2} Q${L} ${Y-16} ${L+16} ${Y+2}" stroke="#1d1a2a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${R-16} ${Y+2} Q${R} ${Y-16} ${R+16} ${Y+2}" stroke="#1d1a2a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      case 'surprise':
        return `<g class="blink" style="transform-origin:200px ${Y}px">${iris(L,Y,10,13)}${iris(R,Y,10,13)}</g>${lash(L,Y-6,19)}${lash(R,Y-6,19)}`;
      case 'doubt':
        return `<g>${iris(L,Y+2,13,16,2,2)}${iris(R,Y+2,13,16,2,2)}<path d="M${L-20} ${Y-14} L${L+20} ${Y-8} L${L+20} ${Y-22} L${L-20} ${Y-22}Z" fill="${skin}"/><path d="M${R-20} ${Y-8} L${R+20} ${Y-12} L${R+20} ${Y-24} L${R-20} ${Y-24}Z" fill="${skin}"/></g><path d="M${L-17} ${Y-12} L${L+18} ${Y-7}" stroke="#1d1a2a" stroke-width="5" stroke-linecap="round"/><path d="M${R-18} ${Y-7} L${R+18} ${Y-11}" stroke="#1d1a2a" stroke-width="5" stroke-linecap="round"/>`;
      case 'think':
        return `<g class="blink" style="transform-origin:200px ${Y}px">${iris(L,Y,13,17,4,-4)}${iris(R,Y,13,17,4,-4)}</g>${lash(L,Y-2,18)}${lash(R,Y-2,18)}`;
      case 'sad': case 'worry':
        return `<g class="blink" style="transform-origin:200px ${Y}px">${iris(L,Y+3,13,15,0,2)}${iris(R,Y+3,13,15,0,2)}</g><path d="M${L-16} ${Y-8} Q${L} ${Y-16} ${L+17} ${Y-12}" stroke="#1d1a2a" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M${R-17} ${Y-12} Q${R} ${Y-16} ${R+16} ${Y-8}" stroke="#1d1a2a" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
      case 'angry': case 'serious': case 'point':
        return `<g class="blink" style="transform-origin:200px ${Y}px">${iris(L,Y+2,13,15)}${iris(R,Y+2,13,15)}</g><path d="M${L-18} ${Y-14} L${L+18} ${Y-8}" stroke="#1d1a2a" stroke-width="5" stroke-linecap="round"/><path d="M${R-18} ${Y-8} L${R+18} ${Y-14}" stroke="#1d1a2a" stroke-width="5" stroke-linecap="round"/>`;
      default:
        return `<g class="blink" style="transform-origin:200px ${Y}px">${iris(L,Y,13,17)}${iris(R,Y,13,17)}</g>${lash(L,Y-2,18)}${lash(R,Y-2,18)}`;
    }
  }
  function brows(e, c){
    const d = shade(c,-.2);
    const b=(x1,y1,cx,cy,x2,y2)=>`<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" stroke="${d}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    switch(e){
      case 'surprise': return b(150,160,168,148,186,158)+b(214,158,232,148,250,160);
      case 'doubt': return b(150,168,168,170,186,174)+b(214,166,232,156,250,162);
      case 'think': return b(150,166,168,158,186,164)+b(214,162,232,156,250,164);
      case 'sad': case 'worry': return b(150,170,168,166,186,160)+b(214,160,232,166,250,170);
      case 'angry': case 'serious': case 'point': return b(150,162,168,164,188,172)+b(212,172,232,164,250,162);
      case 'happy': case 'cheer': return b(150,164,168,154,186,162)+b(214,162,232,154,250,164);
      default: return b(150,166,168,158,186,164)+b(214,164,232,158,250,166);
    }
  }
  function mouth(e){
    const Y=252;
    switch(e){
      case 'happy': case 'cheer': return `<path d="M184 ${Y-4} Q200 ${Y+18} 216 ${Y-4} Z" fill="#a8323e"/><path d="M190 ${Y+5} Q200 ${Y+11} 210 ${Y+5}" stroke="#ff8a95" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      case 'surprise': return `<ellipse cx="200" cy="${Y+2}" rx="9" ry="12" fill="#a8323e"/><ellipse cx="200" cy="${Y+7}" rx="6" ry="4" fill="#ff8a95"/>`;
      case 'doubt': return `<path d="M188 ${Y+2} Q200 ${Y-3} 214 ${Y+4}" stroke="#7a2a33" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
      case 'think': return `<path d="M192 ${Y+1} Q202 ${Y+4} 210 ${Y}" stroke="#7a2a33" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
      case 'sad': case 'worry': return `<path d="M188 ${Y+6} Q200 ${Y-4} 212 ${Y+6}" stroke="#7a2a33" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
      case 'angry': case 'serious': return `<path d="M188 ${Y+2} L212 ${Y+2}" stroke="#7a2a33" stroke-width="3.5" stroke-linecap="round"/>`;
      case 'point': return `<path d="M186 ${Y-3} Q200 ${Y+12} 214 ${Y-3} Z" fill="#a8323e"/>`;
      default: return `<path d="M188 ${Y} Q200 ${Y+10} 212 ${Y}" stroke="#7a2a33" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    }
  }

  /* ---------- outfits ---------- */
  function torso(o, sk){
    const c=o.c, c2=o.c2||shade(c,-.2), dk=shade(c,-.28), lt=shade(c,.18);
    const base = `<path d="M112 338 Q140 314 182 306 L218 306 Q260 314 288 338 Q306 360 308 420 L314 800 L86 800 L92 420 Q94 360 112 338 Z" fill="${c}"/>`;
    const folds = `<path d="M150 470 Q160 560 150 650" stroke="${dk}" stroke-width="3" fill="none" opacity=".55"/><path d="M252 480 Q244 570 254 660" stroke="${dk}" stroke-width="3" fill="none" opacity=".55"/><path d="M200 560 Q206 640 198 720" stroke="${dk}" stroke-width="2" fill="none" opacity=".4"/>`;
    switch(o.t){
      case 'coat': return `<path d="M112 338 Q140 314 182 306 L218 306 Q260 314 288 338 Q306 360 308 420 L314 800 L86 800 L92 420 Q94 360 112 338 Z" fill="${c}"/>
        <path d="M176 306 L200 380 L224 306 Z" fill="${o.inner||'#f4f0e6'}"/><path d="M190 318 L200 360 L210 318" fill="${o.tie||'#7a2f3b'}"/>
        <path d="M176 306 Q150 330 146 360 L176 420 L200 380 Z" fill="${lt}"/><path d="M224 306 Q250 330 254 360 L224 420 L200 380 Z" fill="${lt}"/>
        <path d="M200 380 L200 800" stroke="${dk}" stroke-width="3"/><rect x="92" y="560" width="222" height="26" fill="${dk}"/><rect x="186" y="556" width="28" height="34" rx="4" fill="none" stroke="#e8c27a" stroke-width="5"/>
        <circle cx="216" cy="440" r="6" fill="${dk}"/><circle cx="216" cy="500" r="6" fill="${dk}"/>${folds}`;

/* ============ 배경 일러스트 (SVG 1280x720) ============ */
(function(){

      s+=`<rect x="${cx}" y="${y+h-bh}" width="${bw}" height="${bh}" fill="${c}"/><rect x="${cx+2}" y="${y+h-bh+8}" width="${bw-4}" height="3" fill="${S(c,.35)}" opacity=".8"/><rect x="${cx}" y="${y+h-bh}" width="2" height="${bh}" fill="#000" opacity=".15"/>`; cx+=bw+1; }

/* ---------- 명령 실행 ---------- */
const LINE_RE = /^([a-z]+[a-z0-9_]*)(?:\.([a-z]+))?:\s?([\s\S]*)$/;
async function exec(c) {
  const S = G.S;
  if (typeof c === 'string') {
    if (c.startsWith('>')) return say(null, null, c.slice(1).trim());
    const m = c.match(LINE_RE);
    if (m && CH[m[1]]) return say(m[1], m[2] || 'normal', m[3]);
    return say(null, null, c);
  }
  if (typeof c === 'function') return c(G);
  if (c.bg) { await setBg(c.bg, c.place); if (c.clear !== false) clearStage(); return; }
  if (c.place !== undefined && !c.bg && Object.keys(c).length === 1) return setPlace(c.place);
  if (c.stage) { clearStage(); c.stage.forEach(s => Array.isArray(s) ? showChar(s[0], s[1]) : showChar(s, 'normal')); focusChar(null); return sleep(G.auto ? 0 : 250); }
  if (c.show) { showChar(c.show, c.expr || 'normal', { side: c.side }); return; }
  if (c.hide) { if (c.hide === 'all') clearStage(); else [].concat(c.hide).forEach(hideChar); return sleep(G.auto ? 0 : 200); }
  if (c.clue) { for (const id of [].concat(c.clue)) await addClue(id, c.silent); return; }
  if (c.law) { for (const id of [].concat(c.law)) await addLaw(id, c.silent); return; }
  if (c.show_item) return showItem(c.show_item);
  if (c.doc) return showDoc(c.doc);
  if (c.memo) { const k = G.caseNo || 0; (S.memo[k] = S.memo[k] || []); if (!S.memo[k].includes(c.memo)) { S.memo[k].push(c.memo); toast('📝 사건 기록이 추가되었어요'); save(); } return; }
  if (c.choice) return runChoice(c.choice);
  if (c.hub) return runHub(c.hub);
  if (c.room) return runRoom(c.room);
  if (c.nav) return runNav(c.nav);
  if (c.present) return present(c.present);
  if (c.puzzle) return runPuzzle(c.puzzle);
  if (c.write) return writeBox(c.write);
  if (c.input === 'name') { S.name = await askName(); save(); return; }
  if (c.if !== undefined) { const ok = typeof c.if === 'function' ? c.if(S) : (c.if.startsWith('!') ? !S.flags[c.if.slice(1)] : !!S.flags[c.if]); return runList(ok ? (c.then || []) : (c.else || [])); }
  if (c.set) { Object.assign(S.flags, c.set); save(); return; }
  if (c.sc) { for (const k in c.sc) award(k, c.sc[k], c.mx && c.mx[k]); return; }
  if (c.val) { for (const k in c.val) S.vals[k] = (S.vals[k] || 0) + c.val[k]; save(); return; }
  if (c.fx) return fx(c.fx);
  if (c.wait) return sleep(G.auto ? 0 : c.wait);
  if (c.casecard) return caseCard();
  if (c.scene) { G.pendingScene = c.scene; return; }
  if (c.page) return restorePage(c.page);
  if (c.toast) return toast(c.toast);
  if (c.rec) { recordChoice(c.rec, c.text); return; }
  if (c.end) return endCase();
  if (c.ending) return showEnding();
  if (c.save) { save(); return; }
  console.warn('unknown command', c);
}
function recordChoice(q, a) { const S = G.S; S.choices = S.choices.filter(x => x.q !== q); S.choices.push({ c: G.caseNo, q, a: plain(a) }); save(); }
async function runList(list) {
  const tok = G.token;
  for (const c of list) {
    if (tok !== G.token) return;
    await exec(c);
    if (G.pendingScene) return;
  }
}
async function fx(name) {
  const g = $('#game');
  if (name === 'shake') { g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); beep('bad'); }
  else if (name === 'flash') { g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); beep('clue'); }
  else if (name.startsWith('bounce:')) { const s = G.stage.find(x => x.key === name.slice(7)); if (s) { s.el.classList.remove('bounce'); void s.el.offsetWidth; s.el.classList.add('bounce'); } }
  else if (name === 'highfive') { G.stage.forEach(s => { s.el.innerHTML = spriteSVG(s.key, 'cheer'); s.expr = 'cheer'; s.el.classList.remove('bounce', 'dim'); void s.el.offsetWidth; s.el.classList.add('bounce'); }); beep('ok'); }
  return sleep(G.auto ? 0 : 450);
}

/* ---------- 선택 / 허브 ---------- */
async function runChoice(ch) {
  while (true) {
    const opts = ch.opts.filter(o => !o.if || o.if(G.S));
    const i = await choose(ch.q, opts, { autoPick: ch.autoPick });
    const o = opts[i];
    if (ch.rec) recordChoice(ch.rec, o.t);
    if (o.val) for (const k in o.val) G.S.vals[k] = (G.S.vals[k] || 0) + o.val[k];
    if (o.sc) for (const k in o.sc) award(k, o.sc[k], o.mx && o.mx[k]);
    if (o.set) Object.assign(G.S.flags, o.set);
    save();
    if (o.then) await runList(o.then);
    if (G.pendingScene) return;
    if (!o.retry) return;
  }
}
async function runHub(h) {
  const S = G.S, used = new Set();
  if (!S.hubs[h.id]) { S.hubs[h.id] = []; if (h.debate) award('debate', 0, h.opts.length); }
  while (true) {
    const opts = h.opts.map((o, i) => ({ ...o, _i: i, _used: used.has(i) || S.hubs[h.id].includes(i) })).filter(o => !o.if || o.if(S));
    const canExit = used.size >= (h.min || 0) || S.hubs[h.id].length >= (h.min || 0);
    const list = [...opts];
    if (canExit) list.push({ t: h.exit || '이제 결정할 준비가 됐어.', _exit: true, best: true });

/* ---------- 조사(방탈출) ---------- */

/* ---------- 장소 안내도(방탈출 이동) ---------- */
function placeOpen(P) { const S = G.S; return !P.lock || S.flags['unlock_' + P.id] || (P.lock.when && P.lock.when(S)); }
function placeDone(P) { const R = curCase().rooms[P.room]; return R.doneIf ? R.doneIf(G.S) : (R.clues || []).every(hasItem); }

        if (P.lock.puzzle) { if (P.lock.before) await runList(P.lock.before); const ok = await runPuzzle(P.lock.puzzle); if (!ok) continue; S.flags['unlock_' + P.id] = 1; save(); if (P.lock.after) await runList(P.lock.after); }

    const p = el('div', 'panel paper', `<h2>🗺 ${fmt(N.title)}</h2><div class="sub">${fmt(N.sub || '')} · 🔎 찾은 단서 <b>${got} / ${total}</b> · 📖 헌법 자료 ${S.laws.filter(l => (N.laws || []).includes(l)).length} / ${(N.laws || []).length}</div><div class="navgrid"></div><div class="row" style="justify-content:space-between;margin-top:14px"><div class="row"><button class="btn small ghost" data-nb>🗂 수첩</button><button class="btn small ghost" data-hint>💡 힌트</button></div><button class="btn gold" data-done>${fmt(N.doneLabel || '추리 회의 열기 →')}</button></div>`);
    p.style.width = '1120px';

    N.places.forEach(P => {
      const open = placeOpen(P), done = open && placeDone(P), visited = S.visited[P.room] && S.visited[P.room].length;
      const st = !open ? `🔒 ${fmt(P.lockLabel || '잠김')}` : done ? '✔ 조사 완료' : visited ? '🔍 조사 중' : '✨ 새 장소';
      const c = el('div', 'navcard' + (open ? '' : ' locked') + (done ? ' done' : ''), `<div class="ni">${P.icon}</div><div class="nn">${fmt(P.name)}</div><div class="nd">${fmt(P.desc || '')}</div><div class="ns">${st}</div>`);
      c.onclick = () => { beep('click'); close(P.id); };
      grid.appendChild(c);
    });
    const close = v => { w.remove(); G.modals--; res(v); };
    p.querySelector('[data-done]').onclick = () => close('__done');
    p.querySelector('[data-nb]').onclick = () => openNotebook();
    p.querySelector('[data-hint]').onclick = () => openHint();
    w.appendChild(p); $('#ovl').appendChild(w); G.modals++;
    if (G.auto) {
      const cand = N.places.find(P => !placeDone(P) && (placeOpen(P) || P.lock.puzzle) && !(G._autoTried || {})[P.id + ':' + S.clues.length]);
      G._autoTried = G._autoTried || {}; if (cand) G._autoTried[cand.id + ':' + S.clues.length] = 1;
      setTimeout(() => close(cand ? cand.id : '__done'), 0);
    }
  });
}

/* ============ 퍼즐 시스템 ============ */
const PZ_TAG = { evidence: '증거 제시 퍼즐', contra: '증언 모순 찾기', match: '카드 연결 퍼즐', select: '문서 분석 퍼즐', code: '헌법 조문 암호', order: '순서 맞추기 퍼즐', build: '조항 만들기' };
const WRONG_MSG = ['새로운 단서가 필요합니다. 수첩을 다시 살펴볼까요?', '이 주장을 뒷받침할 근거가 있을까요?', '조금 더 생각해 봐요. 다른 사람의 입장에서 보면 어떨까요?'];
function shuffleDet(arr, seed) { const a = [...arr]; let x = seed || 7; for (let i = a.length - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = Math.floor(x / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hashStr(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 100000; return h || 7; }

async function runPuzzle(id) {
  const P = curCase().puzzles[id]; const S = G.S;
  if (!P) { console.error('no puzzle', id); return false; }
  G.hintStack.push({ id: 'pz_' + id, hints: P.hints });
  showDialog(false);
  let r;
  try {
    while (true) {
      r = await puzzleUI(id, P);
      if (r === 'retreat') { await runRoom(P.retreat); continue; }
      break;
    }
  } finally { G.hintStack.pop(); }
  if (r === 'cancel') return false;
  if (!S.solved[id]) {
    S.solved[id] = 1; const pts = P.pts || 3, w = S.attempts[id] || 0;
    award(P.skill || 'reason', Math.max(1, pts - w), pts);
    if (P.skill2) award(P.skill2, Math.max(1, pts - w), pts);
    save();
  }
  if (P.after) await runList(P.after);
  return true;
}

function puzzleUI(id, P) {
  return new Promise(res => {
    const S = G.S;
    const m = modal(`<div class="phead"><span class="ptype">${P.tag || PZ_TAG[P.type]}</span><span class="ptitle">${fmt(P.title)}</span></div>
      <div class="pintro">${fmt(P.intro || '')}</div><div class="pbody"></div>
      <div class="pfoot"><div class="row"><button class="btn small ghost" data-nb>🗂 수첩</button><button class="btn small ghost" data-law>📖 헌법 자료</button><button class="btn small ghost" data-hint>💡 힌트</button>${P.retreat ? '<button class="btn small ghost" data-ret>🔍 현장 다시 조사</button>' : ''}${P.cancel ? '<button class="btn small ghost" data-cancel>↩ 나중에 풀기</button>' : ''}</div>
      <div class="fb"></div><button class="btn gold" data-go>${fmt(P.submit || '판단 제출')}</button></div>`, { cls: 'pz paper', x: false });
    const body = m.p.querySelector('.pbody'), fbEl = m.p.querySelector('.fb'), go = m.p.querySelector('[data-go]');
    m.p.querySelector('[data-nb]').onclick = () => openNotebook();
    m.p.querySelector('[data-law]').onclick = () => openArchive(true);
    m.p.querySelector('[data-hint]').onclick = () => openHint();
    if (P.retreat) m.p.querySelector('[data-ret]').onclick = () => { m.close(); res('retreat'); };
    if (P.cancel) m.p.querySelector('[data-cancel]').onclick = () => { m.close(); res('cancel'); };
    const fb = (t, ok) => { fbEl.innerHTML = fmt(t); fbEl.classList.toggle('ok', !!ok); };
    let cdTimer = null;
    const wrong = (t) => {
      S.attempts[id] = (S.attempts[id] || 0) + 1; save(); beep('bad');
      const msg = t || WRONG_MSG[(S.attempts[id] - 1) % WRONG_MSG.length];
      fb(msg); m.p.classList.remove('shake'); void m.p.offsetWidth; m.p.classList.add('shake');
      // 연타(찍기) 방지: 두 번째 오답부터 생각할 시간
      const n = S.attempts[id];
      if (n >= 2 && !G.auto) {
        let left = Math.min(10 * (n - 1), 30);
        go.disabled = true; const label = go.innerHTML;
        clearInterval(cdTimer);
        const tick = () => { go.innerHTML = `⏳ ${left}초`; fb(msg + `<br><small style="color:#7c7f93">찍어서 맞히기는 어려워요. ${left}초 동안 수첩과 헌법 자료를 다시 읽어 보세요.</small>`); if (left-- <= 0) { clearInterval(cdTimer); go.disabled = false; go.innerHTML = label; fb(msg); } };
        tick(); cdTimer = setInterval(tick, 1000);
      }
    };
    const solved = async (t) => { clearInterval(cdTimer); beep('ok'); fb(t || P.okText || '정답의 실마리를 찾았어요!', true); go.disabled = true; await sleep(G.auto ? 0 : 1300); m.close(); res('ok'); };
    const T = PZ[P.type];
    const ctl = T(body, P, { fb, wrong, solved, id, panel: m.p });
    go.onclick = () => ctl.check();
    if (G.auto) setTimeout(() => { if (ctl.auto) ctl.auto(); solved(); }, 0);
  });
}

function autoCheckHave(ids, label) { const ok = ids.some(hasItem); if (!ok) console.error('UNOBTAINABLE at ' + label + ': ' + ids.join(',')); }

/* 아이템 선택기 */

const PZ = {};

/* 1) 증거 제시: 빈칸마다 알맞은 단서/조문을 제시 */
PZ.evidence = (body, P, h) => {
  const sel = P.slots.map(() => null);
  const render = () => {
    body.innerHTML = `<div class="slots" style="grid-template-columns:${P.slots.length > 2 ? '1fr 1fr' : '1fr'}"></div>`;
    const box = body.firstChild;
    P.slots.forEach((s, i) => {
      const it = sel[i] ? itemOf(sel[i]) : null;
      const d = el('div', 'slot' + (it ? ' filled' : ''), `<div class="sq">${i + 1}. ${fmt(s.q)}</div><div class="sv ${it ? '' : 'none'}">${it ? `<span class="chip">${it.isLaw ? '헌법' : clueType(it)}</span> <b>${fmt(it.name)}</b>` : '눌러서 단서·헌법 자료를 제시하세요'}</div>`);
      d.onclick = async () => { const r = await pickItem(h.panel, s.q, s.filter); if (r) { sel[i] = r; render(); } };
      box.appendChild(d);
    });
  };
  render();
  return {
    check() {
      if (sel.some(x => !x)) { h.fb('모든 빈칸에 증거를 제시해야 문이 열려요.'); return; }
      const bad = []; let msg = null;
      P.slots.forEach((s, i) => { if (!s.ans.includes(sel[i])) { bad.push(i); if (!msg && s.fb && s.fb[sel[i]]) msg = s.fb[sel[i]]; if (!msg && s.wrong) msg = s.wrong; } });
      if (!bad.length) return h.solved();
      const boxes = body.querySelectorAll('.slot');
      // 어느 칸이 틀렸는지는 알려주되, 정답은 알려주지 않음
      if (P.strict) return h.wrong(`${P.slots.length}칸 중 ${bad.length}칸이 사건과 맞지 않아요. 어느 칸인지는 스스로 찾아야 해요.`);
      boxes.forEach((b, i) => { b.classList.remove('bad', 'good'); void b.offsetWidth; b.classList.add(bad.includes(i) ? 'bad' : 'good'); });
      h.wrong((bad.length === P.slots.length ? '모든 칸을 다시 생각해 봐요. ' : `${bad.length}개의 칸이 사건과 맞지 않아요. `) + (msg || ''));
    },
    auto() { P.slots.forEach((s, i) => { autoCheckHave(s.ans, h.id + ' slot' + i); }); }
  };
};

/* 2) 증언 모순: 거짓 진술 선택 + 반박 증거 제시 */
PZ.contra = (body, P, h) => {
  let st = null, ev = null, tval = '';
  const render = () => {
    body.innerHTML = '';
    P.statements.forEach(s => {
      const d = el('div', 'stm' + (st === s.id ? ' sel' : ''), `<div class="who">${fmt(s.who)}</div><div class="say">“${fmt(s.text)}”</div>`);
      d.onclick = () => { st = s.id; render(); };
      body.appendChild(d);
    });
    const evBox = el('div', 'slot' + (ev ? ' filled' : ''), `<div class="sq">🔎 ${fmt(P.evq || '이 진술과 맞지 않는 증거는?')}</div><div class="sv ${ev ? '' : 'none'}">${ev ? `<b>${fmt(itemOf(ev).name)}</b>` : '눌러서 증거를 제시하세요'}</div>`);
    evBox.style.marginTop = '8px'; evBox.style.minHeight = '80px';
    evBox.onclick = async () => { const r = await pickItem(h.panel, P.evq || '이 진술과 맞지 않는 증거는?'); if (r) { ev = r; render(); } };
    body.appendChild(evBox);
    if (P.askTime) { const tb = el('div', 'slot filled', `<div class="sq">⏱ ${fmt(P.askTime.q)}</div><input class="nm" style="width:220px;font-size:22px" placeholder="예) 12:05" value="${tval}">`); tb.style.marginTop = '8px'; tb.style.minHeight = '70px'; tb.style.cursor = 'default'; const ip = tb.querySelector('input'); ip.oninput = () => { tval = ip.value; }; ip.onkeydown = e => e.stopPropagation(); body.appendChild(tb); }
  };
  render();
  return {
    check() {
      if (!st) { h.fb('먼저 사건과 맞지 않는 진술을 골라 주세요.'); return; }
      if (!ev) { h.fb('그 진술이 틀렸다는 증거를 제시해야 해요.'); return; }
      if (P.askTime) { const d = tval.replace(/\D/g, ''); if (!d) { h.fb('글이 실제로 떼어진 시각도 적어야 해요.'); return; } }
      const timeOk = !P.askTime || P.askTime.ans.includes(tval.replace(/\D/g, ''));
      const bad = (st !== P.answer) + (!P.evidence.includes(ev)) + (!timeOk);
      if (bad) return h.wrong(P.strict ? `세 가지(진술·증거·시각) 중 ${bad}가지가 맞지 않아요.` : (st !== P.answer ? ((P.fbStmt && P.fbStmt[st]) || '그 진술은 다른 증거들과 맞아떨어지는 것 같아요.') : !P.evidence.includes(ev) ? ((P.fbEv && P.fbEv[ev]) || '그 증거로는 반박하기 어려워요.') : '시각이 증거와 맞지 않아요.'));
      h.solved();
    },
    auto() { autoCheckHave(P.evidence, h.id); }
  };
};

/* 3) 카드 연결 */
PZ.match = (body, P, h) => {
  const asg = {}; let armed = null;
  const items = shuffleDet(P.items, hashStr(h.id));
  const render = () => {
    body.innerHTML = `<div class="match"><div class="col" data-c="i"><div style="font-weight:700;color:#5a4a2a">${fmt(P.leftTitle || '카드')}</div></div><div class="col" data-c="t"><div style="font-weight:700;color:#5a4a2a">${fmt(P.rightTitle || '연결할 곳')}</div></div></div>`;
    const ci = body.querySelector('[data-c=i]'), ct = body.querySelector('[data-c=t]');
    items.forEach(it => {
      const t = P.targets.find(x => x.id === asg[it.id]);
      const d = el('div', 'mitem' + (armed === it.id ? ' sel' : ''), `${fmt(it.t)}${t ? `<span class="tagto">→ ${fmt(t.t)}</span>` : ''}`);
      d.onclick = () => { armed = armed === it.id ? null : it.id; render(); };
      ci.appendChild(d);
    });
    P.targets.forEach(t => {
      const chips = items.filter(it => asg[it.id] === t.id).map(it => `<span class="chip">${plain(it.short || it.t).slice(0, 18)}</span>`).join('');
      const d = el('div', 'mtarget' + (armed ? ' armed' : ''), `<div class="tt">${fmt(t.t)}</div>${t.d ? `<div class="td">${fmt(t.d)}</div>` : ''}<div class="chips">${chips}</div>`);
      d.onclick = () => { if (!armed) { h.fb('왼쪽 카드를 먼저 고른 다음, 연결할 곳을 누르세요.'); return; } asg[armed] = t.id; armed = null; h.fb(''); render(); };
      ct.appendChild(d);
    });
  };
  render();
  return {
    check() {
      const un = items.filter(it => !asg[it.id]).length;
      if (un) { h.fb(`아직 연결하지 않은 카드가 ${un}장 있어요.`); return; }
      const bad = items.filter(it => asg[it.id] !== P.answer[it.id]).length;
      if (!bad) return h.solved();
      h.wrong(`${bad}장의 카드가 알맞지 않은 곳에 있어요. ` + (P.wrongTip || ''));
    }
  };
};

/* 4) 문서 분석 (여러 개 고르기) */
PZ.select = (body, P, h) => {
  const on = new Set();
  const render = () => {
    body.innerHTML = P.docTitle ? `<div style="font-weight:700;margin-bottom:8px;color:#5a4a2a">${fmt(P.docTitle)}</div>` : '';
    P.options.forEach((o, i) => {
      const d = el('div', 'opt' + (on.has(i) ? ' sel' : ''), `<span class="chk">${on.has(i) ? '✓' : ''}</span><span>${fmt(o.t)}</span>`);
      d.onclick = () => { on.has(i) ? on.delete(i) : on.add(i); render(); };
      body.appendChild(d);
    });
  };
  render();
  return {
    check() {
      if (!on.size) { h.fb('하나 이상 골라 주세요.'); return; }
      const need = P.options.map((o, i) => o.ok ? i : -1).filter(i => i >= 0);
      const wrongPick = [...on].filter(i => !P.options[i].ok);
      const miss = need.filter(i => !on.has(i));
      if (!wrongPick.length && !miss.length) return h.solved();
      let msg = '';
      if (wrongPick.length) { const o = P.options[wrongPick[0]]; msg = o.fb ? o.fb : `고른 것 중 ${wrongPick.length}개는 다시 생각해 봐요.`; }
      else msg = `거의 다 왔어요! 아직 찾지 못한 것이 ${miss.length}개 있어요.`;
      h.wrong(msg);
    }
  };
};

/* 5) 조문 암호 */
PZ.code = (body, P, h) => {
  body.innerHTML = `<div class="cipher">${fmt(P.cipher)}</div><div class="codebox"><input placeholder="${plain(P.ph || '암호 입력')}"></div>`;
  const inp = body.querySelector('input'); inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter') h.panel.querySelector('[data-go]').click(); };
  setTimeout(() => inp.focus(), 60);
  return {
    check() {
      const v = inp.value.replace(/\s|[·,.\-]/g, '');
      if (!v) { h.fb('암호를 입력해 주세요.'); return; }
      if (P.answer.some(a => a.replace(/\s|[·,.\-]/g, '') === v)) return h.solved();
      h.wrong(P.wrongTip || '암호가 맞지 않아요. 헌법 자료를 다시 읽어 보세요.');
    }
  };
};

/* 6) 순서 맞추기 */
PZ.order = (body, P, h) => {
  let list = shuffleDet(P.items, hashStr(h.id) + 3);
  if (list.every((x, i) => x.id === P.items[i].id)) list.reverse();
  const render = () => {
    body.innerHTML = `${P.topLabel ? `<div style="color:#5a4a2a;font-weight:700;margin-bottom:6px">▲ ${fmt(P.topLabel)}</div>` : ''}<div class="order-list"></div>${P.bottomLabel ? `<div style="color:#5a4a2a;font-weight:700;margin-top:6px">▼ ${fmt(P.bottomLabel)}</div>` : ''}`;
    const box = body.querySelector('.order-list');
    list.forEach((it, i) => {
      const d = el('div', 'ord', `<span class="n">${i + 1}</span><span>${fmt(it.t)}</span><span class="mv"><button data-u>▲</button><button data-d>▼</button></span>`);
      d.querySelector('[data-u]').onclick = () => { if (i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; render(); } };
      d.querySelector('[data-d]').onclick = () => { if (i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; render(); } };
      box.appendChild(d);
    });
  };
  render();
  return {
    check() {
      const bad = list.filter((x, i) => x.id !== P.items[i].id).length;
      if (!bad) return h.solved();
      h.wrong(`${bad}개의 순서가 맞지 않아요. ` + (P.wrongTip || ''));
    }
  };
};

/* 7) 조항 만들기 */
PZ.build = (body, P, h) => {
  if (P.strict && !P._sh) { P._sh = 1; P.slots.forEach((s, i) => { s.opts = shuffleDet(s.opts, hashStr(h.id) + i * 13); }); }
  const pick = P.slots.map(() => null);
  let stage = 'pick';
  const sentence = () => P.slots.map((s, i) => pick[i] != null ? s.opts[pick[i]].t : `[${s.label}]`).join(' ');
  const render = () => {
    if (stage === 'edit') {
      body.innerHTML = `<div class="easy">좋아요! 이제 이 조항을 <b>우리 반 친구들이 이해하기 쉬운 말로</b> 다듬어 보세요. (그대로 두어도 괜찮아요)</div><textarea class="wr" style="margin-top:10px;min-height:140px">${plain(sentence())}</textarea>`;
      return;
    }
    body.innerHTML = '<div class="build"></div><div class="preview"></div>';
    const b = body.querySelector('.build');
    P.slots.forEach((s, i) => {
      const row = el('div', 'bslot', `<div class="blabel">${i + 1}. ${fmt(s.label)}</div><div class="bopts"></div>`);
      s.opts.forEach((o, j) => { const d = el('div', 'bopt' + (pick[i] === j ? ' sel' : ''), fmt(o.t)); d.onclick = () => { pick[i] = j; h.fb(''); render(); }; row.querySelector('.bopts').appendChild(d); });
      b.appendChild(row);
    });
    body.querySelector('.preview').innerHTML = `📜 <b>${fmt(P.clauseTitle || '새 조항')}</b><br>${fmt(sentence())}`;
  };
  render();
  return {
    check() {
      if (stage === 'edit') {
        const v = body.querySelector('textarea').value.trim();
        if (v.length < 10) { h.fb('조항을 조금 더 완성해 주세요.'); return; }
        G.S.writes[P.saveKey] = { q: plain(P.clauseTitle), a: v, c: G.caseNo, cat: '나의 헌법 기록' }; save();
        return h.solved(P.okText);
      }
      if (pick.some(x => x == null)) { h.fb('모든 칸을 골라 주세요.'); return; }
      if (P.strict) { const nb = pick.filter((j, i) => !P.slots[i].opts[j].ok).length; if (nb) return h.wrong(`${P.slots.length}개의 근거 가운데 ${nb}곳의 논리가 사건의 증거와 맞지 않아요. 어느 곳인지는 스스로 찾아야 해요.`); if (P.noEdit) { if (P.saveKey) { G.S.writes[P.saveKey] = { q: plain(P.clauseTitle), a: plain(sentence()), c: G.caseNo, cat: P.saveCat || '나의 헌법 기록' }; save(); } return h.solved(P.okText); } }
      const badI = pick.findIndex((j, i) => P.slots[i].opts[j].ok === false);
      if (badI >= 0) return h.wrong(P.slots[badI].opts[pick[badI]].fb || '이 조항이 누군가의 권리를 빼앗지 않는지 다시 살펴봐요.');
      stage = 'edit'; h.fb('조항의 뼈대가 완성됐어요! 이제 다듬어 보세요.', true);
      h.panel.querySelector('[data-go]').textContent = '조항 확정';
      render();
    },
    auto() { P.slots.forEach((s, i) => { pick[i] = s.opts.findIndex(o => P.strict ? o.ok : o.ok !== false); }); G.S.writes[P.saveKey] = { q: plain(P.clauseTitle), a: sentence(), c: G.caseNo, cat: '나의 헌법 기록' }; }
  };
};

/* 8) 나누기(배분) 논리 퍼즐: 받침 상자 */
PZ.alloc = (body, P, h) => {
  const n = {}; P.people.forEach(p => n[p.id] = P.start ? P.start[p.id] : 0);
  const render = () => {
    const used = Object.values(n).reduce((a, b) => a + b, 0);
    const W = 900, H = 330, ground = 300, scale = 1.6; // 1cm = 1.6px
    const fenceY = ground - P.fence * scale;
    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:300px;background:linear-gradient(#cfe8f7,#f3f9fd);border-radius:12px">
      <rect x="0" y="${ground}" width="${W}" height="${H - ground}" fill="#9ccf86"/>
      <text x="${W - 16}" y="40" text-anchor="end" font-size="20" fill="#2a5a3a" font-family="sans-serif">⚽ 운동장 경기</text>`;
    P.people.forEach((p, i) => {
      const x = 130 + i * 250, bh = P.unit * scale;
      for (let k = 0; k < n[p.id]; k++) svg += `<rect x="${x - 40}" y="${ground - (k + 1) * bh}" width="80" height="${bh - 1}" fill="#e7b46a" stroke="#9c6a26" stroke-width="2"/>`;
      const base = ground - n[p.id] * bh, eye = base - p.eye * scale;
      const sees = p.eye + n[p.id] * P.unit >= P.fence;
      svg += `<g><rect x="${x - 22}" y="${eye + 16}" width="44" height="${p.eye * scale - 16}" rx="16" fill="${p.c}"/><circle cx="${x}" cy="${eye}" r="22" fill="#f7d9c4" stroke="#3a2a22" stroke-width="2"/>
        <circle cx="${x - 8}" cy="${eye - 2}" r="3" fill="#222"/><circle cx="${x + 8}" cy="${eye - 2}" r="3" fill="#222"/><path d="M${x - 8} ${eye + 9} Q${x} ${eye + (sees ? 16 : 4)} ${x + 8} ${eye + 9}" stroke="#222" stroke-width="2.5" fill="none"/>
        <text x="${x}" y="${ground + 24}" text-anchor="middle" font-size="18" font-family="sans-serif" font-weight="bold">${p.name} (눈높이 ${p.eye}cm)</text>
        <text x="${x}" y="${eye - 34}" text-anchor="middle" font-size="22">${sees ? '😊 보여요' : '😢 안 보여요'}</text></g>`;
    });
    svg += `<rect x="0" y="${fenceY}" width="${W}" height="8" fill="#7a5a36"/>${[...Array(18)].map((_, i) => `<rect x="${i * 52 + 10}" y="${fenceY}" width="14" height="${ground - fenceY}" fill="#8a6a46" opacity=".9"/>`).join('')}
      <text x="12" y="${fenceY - 8}" font-size="16" fill="#5a3a1a" font-family="sans-serif">울타리 높이 ${P.fence}cm</text></svg>`;
    body.innerHTML = svg + `<div class="row" style="justify-content:space-around;margin-top:10px">${P.people.map(p => `<div class="row" style="gap:8px"><b>${p.name}</b><button class="btn small ghost" data-m="${p.id}">−</button><span style="font-size:22px;width:30px;text-align:center">${n[p.id]}</span><button class="btn small ghost" data-p="${p.id}">＋</button></div>`).join('')}</div>
      <div class="center" style="margin-top:8px;font-size:18px">사용한 받침 상자 <b>${used}</b> / ${P.total}개 · 상자 1개 높이 = ${P.unit}cm</div>`;
    body.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if (n[b.dataset.m] > 0) { n[b.dataset.m]--; render(); } });
    body.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const u = Object.values(n).reduce((a, c) => a + c, 0); if (u >= P.total) { h.fb(`받침 상자는 ${P.total}개뿐이에요.`); return; } n[b.dataset.p]++; h.fb(''); render(); });
  };
  render();
  return {
    check() {
      const blind = P.people.filter(p => p.eye + n[p.id] * P.unit < P.fence);
      if (blind.length) return h.wrong(`${blind.map(p => p.name).join(', ')}은(는) 아직 경기를 볼 수 없어요. ` + (P.wrongTip || ''));
      h.solved(P.okText);
    }
  };
};
PZ_TAG.alloc = '논리 추리 퍼즐';

/* 9) 빈칸 입력 퍼즐 (시간·숫자·낱말을 직접 계산해 적기) */
PZ.fill = (body, P, h) => {
  const norm = v => String(v).replace(/[\s:·,.\-시분]/g, '');
  body.innerHTML = (P.doc ? `<div class="cipher" style="margin-bottom:12px">${fmt(P.doc)}</div>` : '') + `<div class="slots" style="grid-template-columns:1fr">${P.fields.map((f, i) => `<div class="slot filled" style="cursor:default;min-height:0;display:flex;align-items:center;gap:14px"><div class="sq" style="flex:1;margin:0">${i + 1}. ${fmt(f.label)}</div><input class="nm" data-i="${i}" style="width:200px;font-size:22px" placeholder="${plain(f.ph || '')}"></div>`).join('')}</div>`;
  const ins = [...body.querySelectorAll('input')]; ins.forEach(x => x.onkeydown = e => e.stopPropagation());
  setTimeout(() => ins[0] && ins[0].focus(), 60);
  return {
    check() {
      if (ins.some(x => !x.value.trim())) { h.fb('모든 칸을 채워 주세요.'); return; }
      const bad = P.fields.filter((f, i) => !f.ans.map(norm).includes(norm(ins[i].value))).length;
      if (!bad) return h.solved();
      h.wrong(`${P.fields.length}칸 중 ${bad}칸이 증거와 맞지 않아요. ` + (P.wrongTip || ''));
    }
  };
};
PZ_TAG.fill = '추리 계산 퍼즐';

/* 마을 지도 */

  G.token++; G.playing = false; G.caseNo = 0; curBg = null;

/* 점수 계산 */
function computeStats(S) {
  const started = [1, 2, 3, 4, 5].filter(n => S.done[n] || (S.cur && S.cur.c === n) || S.clues.some(id => CLUES[id] && CLUES[id].c === n));
  const obsMax = Object.keys(CLUES).filter(id => isClue(id) && started.includes(CLUES[id].c)).length || 1;
  const pct = (k) => k === 'obs' ? Math.round(100 * S.clues.filter(id => isClue(id)).length / obsMax) : (S.mx[k] ? Math.round(100 * S.sc[k] / S.mx[k]) : 0);
  const keys = [['obs', '🔎 관찰력', '단서를 얼마나 잘 찾았는가'], ['reason', '🧠 추론력', '단서들을 논리적으로 연결했는가'], ['law', '⚖ 헌법 적용력', '헌법의 가치와 원리를 상황에 적용했는가'], ['debate', '💬 토론력', '여러 관점을 고려했는가'], ['empathy', '❤️ 공감력', '다른 사람의 권리를 고려했는가'], ['solve', '🛠 문제해결력', '갈등 상황의 해결책을 만들었는가']];
  const vals = keys.map(([k, n, d]) => ({ k, n, d, v: Math.min(100, pct(k)) }));
  const avg = vals.reduce((a, b) => a + b.v, 0) / vals.length;
  const total = Math.max(0, Math.round(avg * 10 - S.hints.total * 15));
  return { vals, total, hints: S.hints.total };
}
function detectiveType(S) {
  const v = S.vals; const max = Math.max(...Object.values(v));
  const tops = Object.keys(v).filter(k => v[k] === max && max > 0);
  if (!tops.length) return { title: '모든 가치를 고르게 살핀 탐정', desc: '한쪽으로 치우치지 않고 여러 가치를 함께 생각했어요.', keys: [] };
  if (tops.length === 1) return { ...VALUE_TYPES[tops[0]], keys: tops };
  return { title: tops.map(k => VALUE_NAMES[k]).join('·') + '을(를) 함께 중요하게 생각한 탐정', desc: tops.map(k => VALUE_TYPES[k].desc).join(' '), keys: tops };
}
const mins = ms => Math.max(0, Math.round((ms || 0) / 60000));

      G => waitModal(`<h2>📝 오늘 내가 내린 판단</h2><div class="sub">선언문에 함께 실려요</div><div class="docbody">${(G.S.flags.declAuto || []).map(t => '· ' + t).join('\n')}</div><div class="center" style="margin-top:14px"><button class="btn gold" data-ok>선언문 쓰러 가기</button></div>`, { cls: 'docview paper', build: m => m.p.querySelector('[data-ok]').onclick = () => m.close() }),

      {write: {key: 'decl2', title: '📜 헌법 실천 선언문 ② 나의 책임', q: '두 번째 문장 — <b>그 권리를 위해, 그리고 다른 사람의 권리를 위해 내가 지킬 책임</b>을 적어 보세요.', ph: '예) 그래서 나는 다른 사람을 놀리거나 상처 주는 말을 하지 않겠습니다.', min: 8, cat: '헌법 실천 선언'}},
      {write: {key: 'decl3', title: '📜 헌법 실천 선언문 ③ 우리의 약속', q: '세 번째 문장 — <b>우리 학교(우리 반)를 더 좋은 곳으로 만들기 위해 내가 실천할 일</b>을 적어 보세요.', ph: '예) 우리 반 회의에서 소수의 의견도 끝까지 듣겠습니다.', min: 8, cat: '헌법 실천 선언'}},
